name: TikTok Backup

on:
  schedule:
    - cron: "0 */2 * * *"

  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Run TikTok Backup
        run: |
          curl -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://https://tiktok-scrapper-ten.vercel.app/api/scrape
